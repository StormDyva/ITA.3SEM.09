<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#ffdf5d" />
  <title>Bilgaragen! 🚘</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700;800&family=Fredoka:wght@500;600;700&display=swap');
    :root { --ink: #24203a; --pink: #ff70a6; --yellow: #ffdf5d; --blue: #65d5ff; --green: #a9ed91; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; color: var(--ink); font-family: 'DM Sans', sans-serif; background: repeating-linear-gradient(135deg, #fff8e9 0 18px, #fff2d5 18px 36px); }
    .wrap { width: min(1050px, calc(100% - 32px)); margin: auto; padding: 38px 0 64px; }
    header { position: relative; padding: clamp(25px, 6vw, 58px); border: 4px solid var(--ink); border-radius: 34px; background: var(--yellow); box-shadow: 9px 9px 0 var(--ink); overflow: hidden; }
    header::after { content: '✦'; position: absolute; right: 7%; top: 5%; font-size: clamp(70px, 14vw, 150px); color: var(--pink); transform: rotate(16deg); text-shadow: 4px 4px var(--ink); }
    .eyebrow { display: inline-block; padding: 7px 12px; border: 2px solid var(--ink); border-radius: 99px; background: white; font-weight: 800; transform: rotate(-2deg); }
    h1 { position: relative; z-index: 1; max-width: 620px; margin: 17px 0 8px; font: 700 clamp(42px, 9vw, 82px)/.98 'Fredoka', sans-serif; letter-spacing: -2px; }
    h1 span { color: #ed3f83; text-shadow: 2px 2px white, 4px 4px var(--ink); }
    header p { position: relative; z-index: 1; max-width: 500px; margin: 18px 0 0; font-size: 17px; font-weight: 600; }
    .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 34px 2px 17px; }
    h2 { margin: 0; font: 700 30px 'Fredoka', sans-serif; }
    #count { padding: 8px 14px; border: 2px solid var(--ink); border-radius: 99px; background: var(--blue); font-size: 13px; font-weight: 800; box-shadow: 3px 3px 0 var(--ink); }
    #status { margin: 20px 4px; font-weight: 700; }
    #notes { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); gap: 20px; }
    .note { min-height: 190px; padding: 22px; border: 3px solid var(--ink); border-radius: 20px 20px 20px 5px; background: var(--card); box-shadow: 6px 6px 0 var(--ink); transform: rotate(var(--tilt)); transition: transform .18s ease, box-shadow .18s ease; }
    .note:hover { transform: rotate(0) translateY(-5px); box-shadow: 8px 11px 0 var(--ink); }
    .note-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .note-number { display: grid; place-items: center; width: 34px; height: 34px; border: 2px solid var(--ink); border-radius: 50%; background: white; font: 700 15px 'Fredoka', sans-serif; }
    .doodle { font-size: 24px; }
    .note h3 { margin: 16px 0 8px; font: 700 24px/1.1 'Fredoka', sans-serif; overflow-wrap: anywhere; }
    .note p { margin: 0; line-height: 1.55; white-space: pre-wrap; overflow-wrap: anywhere; }
    .car-image { display: block; width: calc(100% + 44px); height: 150px; margin: -22px -22px 18px; object-fit: cover; border-bottom: 3px solid var(--ink); border-radius: 17px 17px 0 0; }
    .car-details { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px; margin: 16px 0 0; }
    .car-details div { min-width: 0; }
    .car-details dt { font-size: 11px; font-weight: 800; text-transform: uppercase; opacity: .72; }
    .car-details dd { margin: 2px 0 0; font-weight: 700; overflow-wrap: anywhere; }
    .empty, .error { grid-column: 1 / -1; padding: 26px; border: 3px dashed var(--ink); border-radius: 20px; background: white; font-weight: 700; }
    .error { background: #ffd4df; }
    footer { margin-top: 38px; text-align: center; font-size: 13px; font-weight: 700; }
    @media (max-width: 520px) { .wrap { width: min(100% - 22px, 1050px); padding-top: 18px; } header { border-radius: 25px; box-shadow: 6px 6px 0 var(--ink); } header::after { right: 4%; top: 4%; opacity: .8; } header p { max-width: 75%; font-size: 15px; } .toolbar { margin-top: 28px; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; scroll-behavior: auto !important; } }
  </style>
</head>
<body>
  <main class="wrap">
    <header>
      <span class="eyebrow">🚘 BILER, FARVER OG HESTEKRÆFTER</span>
      <h1>Velkommen til <span>bilgaragen!</span></h1>
      <p>Her er bilerne fra vehicle-API'et — med deres detaljer direkte fra backend. 🏁</p>
    </header>
    <section aria-labelledby="notes-heading">
      <div class="toolbar">
        <h2 id="notes-heading">Biler i garagen</h2>
        <span id="count">Henter biler…</span>
      </div>
      <p id="status" role="status" aria-live="polite">🔎 Vi leder efter bilerne…</p>
      <div id="notes" aria-live="polite"></div>
    </section>
    <footer>Lavet med ✨, farver og en lille smule benzin i blodet.</footer>
  </main>
  <script src="/app.js"></script>
</body>
</html>
